<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <!-- viewport-fit=cover lets the app draw under the notch/home indicator;
         safe-area insets are handled in CSS. Fixed scale keeps the webview
         from zooming on input focus so it feels native. interactive-widget
         makes the Android keyboard resize the layout instead of panning it
         (iOS ignores it; the Sheet handles iOS via visualViewport). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Trackr</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
