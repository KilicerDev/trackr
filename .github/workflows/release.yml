# Release on a version tag (`git tag v1.2.3 && git push origin v1.2.3`):
#
#   * the web, worker and scheduler images go to GHCR for amd64 and arm64,
#     each built natively on a runner of that architecture and joined into
#     one multi-platform tag (vX.Y.Z, vX.Y, latest);
#   * the CLI is built for macOS and Linux on both architectures and attached
#     to a GitHub Release together with a checksum file.
#
# Everything authenticates with the token GitHub issues to the workflow; no
# repository secrets are needed. Packages are private on first publish —
# switch each of them to public once in the package settings.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  image:
    name: ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        image: [web, worker, scheduler]
        include:
          - image: web
            context: web
            dockerfile: web/Dockerfile
          - image: worker
            context: services
            dockerfile: services/worker/Dockerfile
          - image: scheduler
            context: services
            dockerfile: services/scheduler/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: name
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/trackr-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          outputs: type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }},mode=max

      - name: Record digest
        run: |
          mkdir -p digests
          touch "digests/${{ steps.build.outputs.digest }}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: ${{ matrix.image }} manifest
    needs: image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [web, worker, scheduler]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true

      - name: Image name
        id: name
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/trackr-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest

      - name: Join the per-arch images into one tag
        working-directory: digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.name.outputs.image }}@sha256:%s ' *)
          docker buildx imagetools inspect "${{ steps.name.outputs.image }}:${{ github.ref_name }}"

  cli:
    name: CLI ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [darwin, linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Build
        working-directory: cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          name="trackr-${{ github.ref_name }}-${GOOS}-${GOARCH}"
          go build -trimpath -ldflags "-s -w -X github.com/KilicerDev/trackr/cli/cmd.version=${{ github.ref_name }}" -o "dist/${name}/trackr" .
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: cli/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    name: GitHub Release
    needs: [manifest, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: cli-*
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz > checksums.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          notes=$(cat <<NOTES
          ## Images

          \`\`\`
          ghcr.io/${owner}/trackr-web:${{ github.ref_name }}
          ghcr.io/${owner}/trackr-worker:${{ github.ref_name }}
          ghcr.io/${owner}/trackr-scheduler:${{ github.ref_name }}
          \`\`\`

          linux/amd64 and linux/arm64. The CLI binaries for macOS and Linux are attached below.
          NOTES
          )
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes --notes "$notes" dist/*
